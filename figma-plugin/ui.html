<meta charset="utf-8" />
<style>
  /* Fundo explícito: o Figma tem tema escuro, e sem isso o texto some. */
  body { font: 11px/1.5 Inter, sans-serif; margin: 0; padding: 12px;
         color: #333; background: #fff; }
  label { display: block; margin: 10px 0 3px; font-weight: 600; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
  select, input { width: 100%; box-sizing: border-box; padding: 5px;
                  border: 1px solid #ddd; border-radius: 4px; font: inherit; }
  input[type=range] { padding: 0; }
  button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 5px;
           background: #0d99ff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { background: #b3b3b3; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .value { float: right; font-weight: 400; color: #888; }
  .status { margin-top: 10px; padding: 7px; border-radius: 4px; background: #f5f5f5; }
  .status.error { background: #ffe3e3; color: #a11; }
  .hint { color: #888; margin-top: 10px; }
  label.inline { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  label.inline input { width: auto; }
</style>

<label>Camada</label>
<select id="layer">
  <option value="inception_3b/output">3b — traços e texturas</option>
  <option value="inception_4a/output">4a — espirais e olhos</option>
  <option value="inception_4c/output" selected>4c — focinhos (clássico)</option>
  <option value="inception_4d/output">4d — criaturas híbridas</option>
  <option value="inception_4e/output">4e — formas compostas</option>
  <option value="inception_5a/output">5a — peixes e répteis</option>
  <option value="inception_5b/output">5b — quimeras</option>
</select>

<label>Modelo</label>
<select id="model">
  <option value="bvlc" selected>bvlc — o DeepDream de 2015</option>
  <option value="places365">places365 — templos e arcos</option>
  <option value="torchvision">torchvision — mais suave</option>
</select>

<label>Iterações <span class="value" id="iterations-value">10</span></label>
<input type="range" id="iterations" min="1" max="60" value="10" />

<label>Intensidade <span class="value" id="step-value">1.5</span></label>
<input type="range" id="step" min="1" max="40" value="15" />

<div class="row">
  <div>
    <label>Octaves</label>
    <input type="number" id="octaves" value="4" min="1" max="8" />
  </div>
  <div>
    <label>Resolução</label>
    <input type="number" id="maxdim" value="1024" min="256" max="4096" step="128" />
  </div>
</div>

<label class="inline">
  <input type="checkbox" id="original" />
  Manter o tamanho original da camada
</label>

<button id="run" disabled>Sonhar</button>
<div class="status" id="status">Conectando…</div>
<div class="hint">
  Precisa do servidor rodando:<br /><code>.venv/bin/python server.py</code>
</div>

<script>
  // O Figma rejeita IP numérico em allowedDomains, então tem de ser o hostname.
  const API = "http://localhost:8000";
  const status = document.getElementById("status");
  const run = document.getElementById("run");
  let selectionCount = 0;
  let serverUp = false;

  const original = document.getElementById("original");
  original.onchange = () =>
    (document.getElementById("maxdim").disabled = original.checked);

  const iterations = document.getElementById("iterations");
  const step = document.getElementById("step");
  iterations.oninput = () =>
    (document.getElementById("iterations-value").textContent = iterations.value);
  step.oninput = () =>
    (document.getElementById("step-value").textContent = (step.value / 10).toFixed(1));

  function say(text, isError) {
    status.textContent = text;
    status.className = isError ? "status error" : "status";
  }

  function refreshButton() {
    run.disabled = !serverUp || selectionCount === 0;
    if (!serverUp) return;
    if (selectionCount === 0) say("Selecione uma camada no Figma.");
  }

  fetch(`${API}/health`)
    .then((r) => r.json())
    .then((info) => {
      serverUp = true;
      say(`Conectado — rodando em ${info.device}.`);
      refreshButton();
    })
    .catch(() => say("Servidor não encontrado. Rode server.py.", true));

  onmessage = async (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === "selection") {
      selectionCount = message.count;
      if (serverUp && message.count > 0) say(`Selecionado: ${message.name || message.count}`);
      refreshButton();
      return;
    }

    if (message.type === "error") {
      say(message.message, true);
      run.disabled = false;
      return;
    }

    if (message.type === "done") {
      say("Pronto.");
      refreshButton();
      return;
    }

    if (message.type === "exported") {
      say("Sonhando… pode levar alguns segundos.");
      // btoa não aceita arrays grandes de uma vez; converte em blocos.
      const bytes = new Uint8Array(message.bytes);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 8192) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }

      try {
        const response = await fetch(`${API}/dream`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image: btoa(binary),
            layers: [document.getElementById("layer").value],
            model: document.getElementById("model").value,
            iterations: Number(iterations.value),
            step_size: Number(step.value) / 10,
            octaves: Number(document.getElementById("octaves").value),
            // 0 diz ao servidor para não reduzir nada.
            max_dim: document.getElementById("original").checked
              ? 0
              : Number(document.getElementById("maxdim").value),
          }),
        });

        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();

        const raw = atob(result.image);
        const out = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);

        parent.postMessage(
          {
            pluginMessage: {
              type: "result",
              bytes: out,
              width: result.width,
              height: result.height,
            },
          },
          "*"
        );
        say("Inserindo no documento…");
      } catch (error) {
        say(String(error), true);
        refreshButton();
      }
    }
  };

  run.onclick = () => {
    run.disabled = true;
    say("Exportando a seleção…");
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");
  };
</script>
