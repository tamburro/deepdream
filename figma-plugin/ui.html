<meta charset="utf-8" />
<style>
  /* Com themeColors no manifesto, o Figma injeta estas variáveis e o painel
     acompanha o tema claro ou escuro de quem está usando. O único destoante é
     o lavanda da ação primária, que é o acento do Dream Canvas. */
  :root {
    --accent: #5e6ad2;
    --accent-hover: #828fff;
  }

  body {
    font: 11px/1.5 Inter, system-ui, sans-serif;
    margin: 0;
    padding: 12px;
    color: var(--figma-color-text, #333);
    background: var(--figma-color-bg, #fff);
  }

  h2 {
    font-size: 11px;
    font-weight: 600;
    margin: 0 0 10px;
    color: var(--figma-color-text, #333);
  }

  label {
    display: block;
    margin: 12px 0 4px;
    font-weight: 500;
    color: var(--figma-color-text-secondary, #666);
  }

  select,
  input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    border: 1px solid var(--figma-color-border, #ddd);
    border-radius: 6px;
    font: inherit;
    background: var(--figma-color-bg-secondary, #fff);
    color: var(--figma-color-text, #333);
  }

  input[type="range"] {
    width: 100%;
    margin: 2px 0;
    accent-color: var(--accent);
  }

  /* Chips de preset: seleção é elevação de superfície, não cor. */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .presets button {
    all: unset;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--figma-color-border, #ddd);
    background: var(--figma-color-bg-secondary, #f5f5f5);
    color: var(--figma-color-text-secondary, #666);
    cursor: pointer;
  }
  .presets button[aria-pressed="true"] {
    background: var(--figma-color-bg-selected, #e5e5ff);
    border-color: var(--figma-color-border-selected, #999);
    color: var(--figma-color-text, #333);
    font-weight: 500;
  }

  button.primary {
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled {
    background: var(--figma-color-bg-disabled, #b3b3b3);
    color: var(--figma-color-text-ondisabled, #fff);
    cursor: default;
  }

  details { margin-top: 14px; }
  summary {
    cursor: pointer;
    font-weight: 500;
    color: var(--figma-color-text-secondary, #666);
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* Valores que mudam ao arrastar não podem alterar a largura da linha. */
  .value {
    float: right;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--figma-color-text-tertiary, #999);
  }

  .status {
    margin-top: 12px;
    padding: 8px;
    border-radius: 6px;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    color: var(--figma-color-text-secondary, #666);
  }
  .status.error {
    background: var(--figma-color-bg-danger-tertiary, #ffe3e3);
    color: var(--figma-color-text-danger, #a11);
  }

  .hint {
    margin-top: 10px;
    color: var(--figma-color-text-tertiary, #999);
  }

  code {
    background: var(--figma-color-bg-secondary, #f0f0f0);
    padding: 1px 4px;
    border-radius: 3px;
  }

  .inline { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  .inline input { width: auto; }
</style>

<h2>Dream Canvas</h2>

<div class="presets" id="presets"></div>

<button class="primary" id="run" disabled>Sonhar</button>
<div class="status" id="status">Conectando…</div>

<details>
  <summary>Ajuste fino</summary>

  <label>Camada</label>
  <select id="layer">
    <option value="inception_3a/output">3a — traços e bordas</option>
    <option value="inception_3b/output">3b — textura pura</option>
    <option value="inception_4a/output">4a — espirais</option>
    <option value="inception_4b/output">4b — olhos soltos</option>
    <option value="inception_4c/output" selected>4c — focinhos e pelo</option>
    <option value="inception_4d/output">4d — criaturas híbridas</option>
    <option value="inception_4e/output">4e — formas compostas</option>
    <option value="inception_5a/output">5a — peixes e répteis</option>
    <option value="inception_5b/output">5b — quimeras</option>
  </select>

  <label>Modelo</label>
  <select id="model">
    <option value="bvlc" selected>Clássico — pesos originais de 2015</option>
    <option value="places365">Cenários — templos e arcos</option>
    <option value="torchvision">Suave — formas mais discretas</option>
  </select>

  <label>Iterações <span class="value" id="iterations-value">10</span></label>
  <input type="range" id="iterations" min="1" max="60" value="10" />

  <label>Força <span class="value" id="step-value">1.5</span></label>
  <input type="range" id="step" min="1" max="40" value="15" />

  <div class="row">
    <div>
      <label>Escalas</label>
      <input type="number" id="octaves" value="4" min="1" max="8" />
    </div>
    <div>
      <label>Resolução</label>
      <input type="number" id="maxdim" value="1024" min="256" max="4096" step="128" />
    </div>
  </div>

  <label class="inline" style="margin-top: 10px">
    <input type="checkbox" id="original" />
    Manter o tamanho original da camada
  </label>
</details>

<div class="hint">
  Precisa do Dream Canvas rodando:<br /><code>.venv/bin/python server.py</code>
</div>

<script>
  // O Figma rejeita IP numérico em allowedDomains, então tem de ser o hostname.
  const API = "http://localhost:8000";

  // Os mesmos estilos da interface principal, para o resultado bater.
  const PRESETS = {
    "Clássico 2015": { model: "bvlc", layer: "inception_4c/output", iterations: 10, step: 1.5 },
    "Focinhos por toda parte": { model: "bvlc", layer: "inception_4c/output", iterations: 25, step: 2.0 },
    "Criaturas híbridas": { model: "bvlc", layer: "inception_4d/output", iterations: 20, step: 1.5 },
    "Quimeras": { model: "bvlc", layer: "inception_5b/output", iterations: 40, step: 2.0 },
    "Só textura": { model: "bvlc", layer: "inception_3b/output", iterations: 10, step: 1.5 },
    "Templos e arcos": { model: "places365", layer: "inception_4d/output", iterations: 20, step: 1.5 },
    "Discreto": { model: "torchvision", layer: "inception_4c/output", iterations: 10, step: 1.5 },
  };

  const $ = (id) => document.getElementById(id);
  const status = $("status");
  const run = $("run");
  const iterations = $("iterations");
  const step = $("step");
  const original = $("original");

  let selectionCount = 0;
  let serverUp = false;

  function showValues() {
    $("iterations-value").textContent = iterations.value;
    $("step-value").textContent = (step.value / 10).toFixed(1);
  }
  iterations.oninput = showValues;
  step.oninput = showValues;
  original.onchange = () => ($("maxdim").disabled = original.checked);

  // Presets
  const presetBox = $("presets");
  Object.keys(PRESETS).forEach((name, index) => {
    const chip = document.createElement("button");
    chip.textContent = name;
    chip.setAttribute("aria-pressed", index === 0 ? "true" : "false");
    chip.onclick = () => {
      [...presetBox.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
      chip.setAttribute("aria-pressed", "true");
      const p = PRESETS[name];
      $("model").value = p.model;
      $("layer").value = p.layer;
      iterations.value = p.iterations;
      step.value = Math.round(p.step * 10);
      showValues();
    };
    presetBox.appendChild(chip);
  });

  function say(text, isError) {
    status.textContent = text;
    status.className = isError ? "status error" : "status";
  }

  function refreshButton() {
    run.disabled = !serverUp || selectionCount === 0;
    if (serverUp && selectionCount === 0) say("Selecione uma camada no Figma.");
  }

  fetch(`${API}/health`)
    .then((r) => r.json())
    .then((info) => {
      serverUp = true;
      say(`Conectado, processando em ${info.device}.`);
      refreshButton();
    })
    .catch(() => say("Dream Canvas não encontrado. Rode o server.py.", true));

  onmessage = async (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === "selection") {
      selectionCount = message.count;
      if (serverUp && message.count > 0) say(`Camada: ${message.name || message.count}`);
      refreshButton();
      return;
    }

    if (message.type === "error") {
      say(message.message, true);
      refreshButton();
      return;
    }

    if (message.type === "done") {
      say("Pronto.");
      refreshButton();
      return;
    }

    if (message.type === "exported") {
      say("Sonhando…");
      // btoa não aceita arrays grandes de uma vez; converte em blocos.
      const bytes = new Uint8Array(message.bytes);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 8192) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }

      try {
        const response = await fetch(`${API}/dream`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image: btoa(binary),
            layers: [$("layer").value],
            model: $("model").value,
            iterations: Number(iterations.value),
            step_size: Number(step.value) / 10,
            octaves: Number($("octaves").value),
            // 0 diz ao servidor para não reduzir nada.
            max_dim: original.checked ? 0 : Number($("maxdim").value),
          }),
        });

        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();

        const raw = atob(result.image);
        const out = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);

        parent.postMessage(
          {
            pluginMessage: {
              type: "result",
              bytes: out,
              width: result.width,
              height: result.height,
            },
          },
          "*"
        );
        say("Inserindo no documento…");
      } catch (error) {
        say(String(error), true);
        refreshButton();
      }
    }
  };

  run.onclick = () => {
    run.disabled = true;
    say("Exportando a camada…");
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");
  };
</script>
